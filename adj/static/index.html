<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>IDL adjudicators: room allocation</title>
<link rel="stylesheet" href="adj.css">
</head>
<body>
<header class="bar"><div class="bar-in"><h1>IDL adjudicators: rooms by day</h1><p class="tz">All times are IST</p></div></header>
<div id="warn" class="warn" role="status" hidden></div>
<main>
  <p id="loading" class="msg">Loading the allocation…</p>
  <div id="app" hidden>
    <div id="days" class="days" role="group" aria-label="Day"></div>
    <label class="field" for="q">Find an adjudicator</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a name to see their rooms on every day">
    <div id="out"></div>
    <p class="sum">Your debates and ballot buttons are on your personal link. Ask the organisers if you have not received it.</p>
  </div>
</main>
<footer class="foot" id="foot"></footer>
<script src="shared/time.js"></script>
<script src="allocation.js"></script>
</body>
</html>
