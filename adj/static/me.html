<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>IDL adjudicator: my debates</title>
<link rel="stylesheet" href="adj.css">
</head>
<body>
<header class="bar"><div class="bar-in"><h1>IDL adjudicator</h1><p class="tz">All times are IST</p></div></header>
<div id="warn" class="warn" role="status" hidden></div>
<main>
  <p id="loading" class="msg">Loading your debates…</p>
  <div id="app" hidden>
    <h2 id="hello" class="hello"></h2>
    <div id="days" class="days" role="group" aria-label="Day"></div>
    <p id="rooms" class="rooms"></p>
    <div id="band"></div>
    <div id="list"></div>
    <ul id="notes" class="notes" hidden></ul>
  </div>
</main>
<footer class="foot" id="foot"></footer>
<script src="shared/time.js"></script>
<script src="me.js"></script>
</body>
</html>
